networks:
  fbpage-internal:
    driver: bridge

services:
  postgres-db:
    image: postgres:16.4-alpine
    container_name: fbpage-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fbpage_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fbpage_super_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fbpage_prod}
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - fbpage-internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fbpage_admin} -d ${POSTGRES_DB:-fbpage_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7.2.5-alpine
    container_name: fbpage-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026} --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - fbpage-internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-s3:
    image: minio/minio:latest
    container_name: fbpage-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - fbpage-internal
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: ..
      dockerfile: apps/api-server/Dockerfile
    container_name: fbpage-api-server
    restart: always
    networks:
      - fbpage-internal
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fbpage_admin}:${POSTGRES_PASSWORD:-fbpage_super_secret_pass_2026}@postgres-db:5432/${POSTGRES_DB:-fbpage_prod}?schema=public
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres-db:
        condition: service_healthy

  worker-engine:
    build:
      context: ..
      dockerfile: apps/worker-engine/Dockerfile
    container_name: fbpage-worker-engine
    restart: always
    networks:
      - fbpage-internal
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fbpage_admin}:${POSTGRES_PASSWORD:-fbpage_super_secret_pass_2026}@postgres-db:5432/${POSTGRES_DB:-fbpage_prod}?schema=public
      REDIS_HOST: redis-queue
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
